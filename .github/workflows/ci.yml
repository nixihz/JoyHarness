name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install CI tools
        run: brew install go-task shellcheck

      - name: Test, lint, and build
        run: task ci

      - name: Validate release metadata
        run: task release-check

  firmware:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install firmware toolchain
        run: |
          brew install go-task cmake ninja
          brew install --cask gcc-arm-embedded

      - name: Build RP2040 firmware
        run: task firmware
