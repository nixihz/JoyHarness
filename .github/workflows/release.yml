name: Release DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to release (for example, 0.8.2)
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        required: true
        default: false
        type: boolean
      backfill_arch:
        description: Add a missing architecture to the latest stable release
        required: true
        default: none
        type: choice
        options:
          - none
          - arm64
          - x86_64

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release request
        id: plan
        env:
          VERSION_INPUT: ${{ inputs.version }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
          BACKFILL_ARCH: ${{ inputs.backfill_arch }}
        run: python3 scripts/plan_release.py "$VERSION_INPUT" --prerelease "$PRERELEASE_INPUT" --backfill-arch "$BACKFILL_ARCH"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0

      - name: Install release tools
        run: |
          brew install go-task shellcheck cmake ninja
          brew install --cask gcc-arm-embedded

      - name: Set architecture-specific artifact names
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          [[ "$ARCH" == "$EXPECTED_ARCH" ]]
          DMG_NAME="Joy-Harness-v${VERSION}-macOS-${ARCH}.dmg"
          if [[ "$ARCH" == arm64 ]]; then
            FEED_NAME=appcast.xml
          else
            FEED_NAME=appcast-x86_64.xml
          fi
          {
            echo "DMG_NAME=${DMG_NAME}"
            echo "DMG_PATH=${GITHUB_WORKSPACE}/dist/${DMG_NAME}"
            echo "CHECKSUM_PATH=${GITHUB_WORKSPACE}/dist/${DMG_NAME}.sha256"
            echo "FEED_NAME=${FEED_NAME}"
          } >> "$GITHUB_ENV"

      - name: Validate release secrets
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          VALUES=(
            "${CERTIFICATE_BASE64}"
            "${CERTIFICATE_PASSWORD}"
            "${API_KEY_BASE64}"
            "${API_KEY_ID}"
            "${API_ISSUER_ID}"
          )
          CONFIGURED=0
          for VALUE in "${VALUES[@]}"; do
            if [[ -n "${VALUE}" ]]; then
              CONFIGURED=$((CONFIGURED + 1))
            fi
          done

          if [[ "${CONFIGURED}" -eq 0 ]]; then
            echo "RELEASE_MODE=unnotarized" >> "${GITHUB_ENV}"
            echo "JOY_HARNESS_SIGNING_IDENTITY=-" >> "${GITHUB_ENV}"
          elif [[ "${CONFIGURED}" -ne "${#VALUES[@]}" ]]; then
            echo "Signing/notarization secrets are only partially configured." >&2
            exit 1
          else
            echo "RELEASE_MODE=notarized" >> "${GITHUB_ENV}"
          fi

      - name: Run shared release checks
        run: |
          task ci
          task release-check -- "${TAG}"
          task firmware

      - name: Require signing for an existing stable release
        if: inputs.backfill_arch != 'none'
        run: test "$RELEASE_MODE" = notarized

      - name: Load current distribution tools for backfill
        if: inputs.backfill_arch != 'none'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts

      - name: Apply distribution tools to the tagged source
        if: inputs.backfill_arch != 'none'
        run: |
          # Application sources and resources remain exactly those of the release tag.
          for tool in package_dmg.sh embed_sparkle.sh verify_packaged_app.py verify_sparkle_appcast.py; do
            cp ".release-tools/scripts/$tool" "scripts/$tool"
          done

      - name: Import Developer ID certificate
        if: env.RELEASE_MODE == 'notarized'
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="${RUNNER_TEMP}/developer-id.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "${CERTIFICATE_BASE64}" | base64 --decode -o "${CERTIFICATE_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" \
            -P "${CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${KEYCHAIN_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"

          SIGNING_IDENTITY="$({
            security find-identity -v -p codesigning "${KEYCHAIN_PATH}" \
              | sed -n 's/.*"\(Developer ID Application:[^"]*\)"/\1/p'
          } | head -n 1)"
          if [[ -z "${SIGNING_IDENTITY}" ]]; then
            echo "No Developer ID Application identity was imported." >&2
            exit 1
          fi
          echo "JOY_HARNESS_SIGNING_IDENTITY=${SIGNING_IDENTITY}" >> "${GITHUB_ENV}"

      - name: Enable Sparkle for signed stable releases
        if: env.RELEASE_MODE == 'notarized' && inputs.prerelease == false
        run: echo "JOY_HARNESS_ENABLE_SPARKLE=1" >> "${GITHUB_ENV}"

      - name: Validate Sparkle publishing prerequisites
        if: env.RELEASE_MODE == 'notarized' && inputs.prerelease == false
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_EDDSA_PRIVATE_KEY}" ]]; then
            echo "Sparkle EdDSA signing secret is missing." >&2
            exit 1
          fi

      - name: Build DMG
        run: bash scripts/package_dmg.sh "${VERSION}"

      - name: Notarize and staple DMG
        if: env.RELEASE_MODE == 'notarized'
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          API_KEY_PATH="${RUNNER_TEMP}/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "${API_KEY_BASE64}" | base64 --decode -o "${API_KEY_PATH}"

          NOTARY_RESULT="${RUNNER_TEMP}/notarization-result.json"
          xcrun notarytool submit "${DMG_PATH}" \
            --key "${API_KEY_PATH}" \
            --key-id "${API_KEY_ID}" \
            --issuer "${API_ISSUER_ID}" \
            --wait --output-format json > "${NOTARY_RESULT}"
          cat "${NOTARY_RESULT}"
          SUBMISSION_ID="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["id"])' "${NOTARY_RESULT}")"
          NOTARY_STATUS="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["status"])' "${NOTARY_RESULT}")"
          if [[ "${NOTARY_STATUS}" != "Accepted" ]]; then
            xcrun notarytool log "${SUBMISSION_ID}" \
              --key "${API_KEY_PATH}" \
              --key-id "${API_KEY_ID}" \
              --issuer "${API_ISSUER_ID}"
            echo "Apple notarization failed: ${NOTARY_STATUS}" >&2
            exit 1
          fi
          xcrun stapler staple "${DMG_PATH}"
          xcrun stapler validate "${DMG_PATH}"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            "${DMG_PATH}"

          (
            cd "$(dirname "${DMG_PATH}")"
            shasum -a 256 "${DMG_NAME}" > "${DMG_NAME}.sha256"
          )

      - name: Verify release assets
        run: |
          set -euo pipefail
          hdiutil verify "${DMG_PATH}"
          (
            cd "$(dirname "${DMG_PATH}")"
            shasum -a 256 -c "${DMG_NAME}.sha256"
          )

      - name: Generate signed Sparkle appcast
        id: feed
        if: env.RELEASE_MODE == 'notarized' && inputs.prerelease == false
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          FEED_DIR="${RUNNER_TEMP}/sparkle-feed"
          mkdir -p "${FEED_DIR}"
          cp "${DMG_PATH}" "${FEED_DIR}/${DMG_NAME}"
          FEED_URL="https://github.com/nixihz/JoyHarness/releases/latest/download/${FEED_NAME}"
          HTTP_STATUS="$(curl --location --silent --show-error \
            --output "${FEED_DIR}/${FEED_NAME}" --write-out '%{http_code}' "${FEED_URL}")"
          if [[ "${HTTP_STATUS}" == "404" ]]; then
            unlink "${FEED_DIR}/${FEED_NAME}"
          elif [[ "${HTTP_STATUS}" != "200" ]]; then
            echo "Cannot read existing Sparkle feed: HTTP ${HTTP_STATUS}" >&2
            exit 1
          fi
          APPCAST_TOOL="$(find .build/artifacts -type f -path '*/Sparkle/bin/generate_appcast' -print -quit)"
          if [[ -z "${APPCAST_TOOL}" ]]; then
            echo "Sparkle generate_appcast tool is missing" >&2
            exit 1
          fi
          printf '%s' "${SPARKLE_EDDSA_PRIVATE_KEY}" | "${APPCAST_TOOL}" \
            --ed-key-file - \
            --maximum-deltas 0 \
            --download-url-prefix "https://github.com/nixihz/JoyHarness/releases/download/${TAG}/" \
            "${FEED_DIR}"
          python3 scripts/verify_sparkle_appcast.py "${FEED_DIR}/${FEED_NAME}" "${VERSION}" "${DMG_NAME}"
          cp "${FEED_DIR}/${FEED_NAME}" "dist/${FEED_NAME}"

      - name: Stage verified release artifacts
        run: |
          mkdir -p release-assets
          cp "$DMG_PATH" "$CHECKSUM_PATH" release-assets/
          if [[ "$RELEASE_MODE" == notarized && "${{ inputs.prerelease }}" == false ]]; then
            cp "dist/$FEED_NAME" release-assets/
          fi
          echo "$RELEASE_MODE" > "release-assets/signing-mode-${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      PRERELEASE: ${{ inputs.prerelease }}
      BACKFILL_ARCH: ${{ inputs.backfill_arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete artifact set
        run: |
          set -euo pipefail
          ARCHES="arm64 x86_64"
          if [[ "$BACKFILL_ARCH" != none ]]; then ARCHES="$BACKFILL_ARCH"; fi
          RELEASE_MODE=""
          for ARCH in $ARCHES; do
            MODE="$(cat "release-assets/signing-mode-$ARCH.txt")"
            [[ "$MODE" == notarized || "$MODE" == unnotarized ]]
            [[ -z "$RELEASE_MODE" || "$RELEASE_MODE" == "$MODE" ]]
            RELEASE_MODE="$MODE"
            DMG_NAME="Joy-Harness-v${VERSION}-macOS-${ARCH}.dmg"
            (cd release-assets && sha256sum -c "$DMG_NAME.sha256")
            if [[ "$RELEASE_MODE" == notarized && "$PRERELEASE" == false ]]; then
              FEED_NAME=appcast.xml
              if [[ "$ARCH" == x86_64 ]]; then FEED_NAME=appcast-x86_64.xml; fi
              python3 scripts/verify_sparkle_appcast.py "release-assets/$FEED_NAME" "$VERSION" "$DMG_NAME"
            fi
          done
          echo "RELEASE_MODE=$RELEASE_MODE" >> "$GITHUB_ENV"

      - name: Write release notes
        run: |
          python3 - <<'PYNOTES'
          import os, re, subprocess
          from pathlib import Path
          version = os.environ['VERSION']
          readme = subprocess.check_output(['git', 'show', os.environ['SOURCE_SHA'] + ':README.md'], text=True)
          match = re.search(r"## What's New in v?" + re.escape(version) + r'\n\n(.*?)(?=\n## |\Z)', readme, re.S)
          notes = f"Joy Harness v{version} for Apple Silicon (arm64) and Intel (x86_64 / AMD64) Macs running macOS 13.0 or later.\n\n"
          if match:
              notes += "## What's New\n\n" + match.group(1).strip() + "\n\n"
          notes += "## Install\n\nChoose the DMG for your Mac's processor and its matching .sha256 file:\n\n"
          for arch, label in [('arm64', 'Apple Silicon'), ('x86_64', 'Intel')]:
              notes += f"- {label}: `Joy-Harness-v{version}-macOS-{arch}.dmg`\n"
          notes += "\nOpen the DMG and drag Joy Harness.app to Applications.\n\n"
          if os.environ['RELEASE_MODE'] == 'notarized':
              notes += "Both builds are signed with Developer ID Application and notarized by Apple.\n"
          else:
              notes += "These builds are not notarized. macOS may require approval in System Settings > Privacy & Security before first launch.\n"
          notes += "\nThe DMGs contain the desktop app. Install from source with task install when Codex hooks, login startup, notify bridge, and the local CLI are also required.\n"
          Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(notes)
          PYNOTES

      - name: Create draft release and upload assets
        if: inputs.backfill_arch == 'none'
        run: |
          set -euo pipefail
          python3 scripts/plan_release.py "$VERSION" --prerelease "$PRERELEASE"
          create_release() {
            ASSETS=()
            for ARCH in arm64 x86_64; do
              DMG_NAME="Joy-Harness-v${VERSION}-macOS-${ARCH}.dmg"
              ASSETS+=("release-assets/$DMG_NAME#Joy Harness ${TAG} for macOS ${ARCH}")
              ASSETS+=("release-assets/$DMG_NAME.sha256#SHA-256 checksum (${ARCH})")
            done
            if [[ "$RELEASE_MODE" == notarized && "$PRERELEASE" == false ]]; then
              ASSETS+=("release-assets/appcast.xml#Sparkle appcast (arm64)")
              ASSETS+=("release-assets/appcast-x86_64.xml#Sparkle appcast (x86_64)")
            fi
            gh release create "$TAG" "${ASSETS[@]}" --target "$SOURCE_SHA" --draft \
              --title "Joy Harness $TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "$@"
          }
          if [[ "$PRERELEASE" == true ]]; then create_release --prerelease; else create_release; fi

      - name: Add missing architecture to the existing release
        if: inputs.backfill_arch != 'none'
        run: |
          set -euo pipefail
          # Recheck immediately before upload; existing files are never clobbered.
          python3 scripts/plan_release.py "$VERSION" --backfill-arch "$BACKFILL_ARCH"
          [[ "$(git rev-parse "refs/tags/${TAG}^{commit}")" == "$SOURCE_SHA" ]]
          DMG_NAME="Joy-Harness-v${VERSION}-macOS-${BACKFILL_ARCH}.dmg"
          FEED_NAME=appcast.xml
          if [[ "$BACKFILL_ARCH" == x86_64 ]]; then FEED_NAME=appcast-x86_64.xml; fi
          gh release upload "$TAG" \
            "release-assets/$DMG_NAME#Joy Harness ${TAG} for macOS ${BACKFILL_ARCH}" \
            "release-assets/$DMG_NAME.sha256#SHA-256 checksum (${BACKFILL_ARCH})" \
            "release-assets/$FEED_NAME#Sparkle appcast (${BACKFILL_ARCH})"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Publish release
        if: inputs.backfill_arch == 'none'
        run: |
          if [[ "${PRERELEASE}" == "true" ]]; then
            gh release edit "${TAG}" --draft=false --latest=false
          elif [[ "${RELEASE_MODE}" != "notarized" ]]; then
            gh release edit "${TAG}" --draft=false --latest=false
          else
            gh release edit "${TAG}" --draft=false --latest
          fi

      - name: Verify published feed
        if: env.RELEASE_MODE == 'notarized' && inputs.prerelease == false
        run: |
          set -euo pipefail
          ARCHES="arm64 x86_64"
          if [[ "$BACKFILL_ARCH" != none ]]; then ARCHES="$BACKFILL_ARCH"; fi
          for ARCH in $ARCHES; do
            FEED_NAME=appcast.xml
            if [[ "$ARCH" == x86_64 ]]; then FEED_NAME=appcast-x86_64.xml; fi
            FEED_URL="https://github.com/nixihz/JoyHarness/releases/latest/download/$FEED_NAME"
            VERIFIED=false
            for attempt in {1..30}; do
              echo "Checking published Sparkle feed for $ARCH (attempt $attempt)"
              if curl --fail --location --silent --show-error "$FEED_URL" \
                  --output "$RUNNER_TEMP/$FEED_NAME" \
                  && python3 scripts/verify_sparkle_appcast.py "$RUNNER_TEMP/$FEED_NAME" "$VERSION" \
                    "Joy-Harness-v${VERSION}-macOS-${ARCH}.dmg"; then
                VERIFIED=true
                break
              fi
              sleep 10
            done
            if [[ "$VERIFIED" != true ]]; then
              echo "Sparkle feed for $ARCH does not expose version $VERSION" >&2
              exit 1
            fi
          done
